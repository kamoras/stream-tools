# Production stack on the shared Oracle VM (see docs/DEPLOYMENT.md).
#
# The VM's ports 80/443 belong to the Caddy container from the
# dead-by-daylight-twitch-bot deployment. This app joins that Caddy on the
# shared `edge` Docker network and is published through a site file the
# deploy workflow writes to /opt/caddy/sites/. No ports are exposed here.
services:
  app:
    image: ghcr.io/kamoras/hues-and-cues-twitch:latest
    container_name: hues-and-cues
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: 'true'
    volumes:
      - ./data:/data
    networks:
      edge:
        aliases:
          - hues-and-cues
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  edge:
    external: true
