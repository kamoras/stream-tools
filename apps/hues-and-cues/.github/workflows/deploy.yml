name: Deploy

on:
  # Only runs after CI passes on main, so broken code is never deployed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual redeploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Oracle's Always Free VMs may be Arm (A1) or x86 (E2), so build both.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check required secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          missing=0
          for name in ORACLE_HOST ORACLE_USER ORACLE_SSH_KEY DOMAIN; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Prepare server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -eu
            sudo mkdir -p /opt/hues-and-cues/data /opt/caddy/sites
            sudo chown -R "$USER:$USER" /opt/hues-and-cues
            # The container runs as the image's `node` user (uid 1000).
            sudo chown -R 1000:1000 /opt/hues-and-cues/data
            sudo docker network inspect edge >/dev/null 2>&1 || sudo docker network create edge

      - name: Copy compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/caddy-site.caddy
          target: /opt/hues-and-cues/
          strip_components: 1

      - name: Configure and start
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -eu
            cd /opt/hues-and-cues

            umask 077
            cat > .env <<'ENVEOF'
            REGISTRATION_ENABLED=${{ secrets.REGISTRATION_ENABLED || 'true' }}
            REGISTRATION_CODE=${{ secrets.REGISTRATION_CODE }}
            ALLOWED_CHANNELS=${{ secrets.ALLOWED_CHANNELS }}
            LOG_LEVEL=info
            ENVEOF
            # Drop empty optional settings so the app's defaults apply.
            sed -i -E '/^[A-Z_]+=$/d' .env

            sed 's/__DOMAIN__/${{ secrets.DOMAIN }}/' caddy-site.caddy \
              | sudo tee /opt/caddy/sites/hues-and-cues.caddy >/dev/null

            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f

            echo "Waiting for the app to report healthy..."
            for _ in $(seq 1 30); do
              status=$(sudo docker inspect -f '{{.State.Health.Status}}' hues-and-cues 2>/dev/null || true)
              if [ "$status" = healthy ]; then break; fi
              sleep 2
            done
            if [ "$status" != healthy ]; then
              sudo docker compose logs --tail 50 app
              echo "App did not become healthy (status: $status)" >&2
              exit 1
            fi

            if sudo docker ps --format '{{.Names}}' | grep -qx dbd-caddy; then
              sudo docker exec dbd-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            else
              echo "WARNING: shared Caddy (dbd-caddy) is not running; the site is not published yet." >&2
            fi

      - name: Smoke test
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$DOMAIN/healthz"; then exit 0; fi
            echo "Attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "::error::https://$DOMAIN/healthz did not respond. Check DNS and the shared Caddy (see docs/DEPLOYMENT.md)."
          exit 1
