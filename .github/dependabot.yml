version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /apps/dbd-bot
      - /apps/hues-and-cues
      - /apps/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint pins its TypeScript peer range (8.71 accepts <6.1), so
      # a TypeScript major breaks npm ci until typescript-eslint supports it.
      # Remove this once a typescript-eslint release accepts the new major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: docker
    directories:
      - /apps/dbd-bot
      - /apps/hues-and-cues
      - /apps/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
