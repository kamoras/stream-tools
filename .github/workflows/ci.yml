name: CI

on:
  pull_request:
  # Called by deploy.yml so main is always tested before it is deployed.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dbd-bot:
    name: dbd-bot · lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dbd-bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/dbd-bot/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  hues-and-cues:
    name: hues-and-cues · lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/hues-and-cues
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/hues-and-cues/.nvmrc
          cache: npm
          cache-dependency-path: apps/hues-and-cues/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  admin:
    name: admin · lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/admin/.nvmrc
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: ${{ matrix.app }} · image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [dbd-bot, hues-and-cues, admin]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  infra:
    name: infra · validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR infra/scripts/*.sh
      - name: Compose file
        working-directory: infra
        run: |
          mkdir -p env
          for f in caddy internal-dbd-bot internal-hues-and-cues internal-admin dbd-bot hues-and-cues admin; do touch "env/$f.env"; done
          docker compose config --quiet
      - name: Caddy config
        run: |
          mkdir -p /tmp/caddy/sites
          cp infra/caddy/Caddyfile /tmp/caddy/
          cp infra/sites-available/*.caddy /tmp/caddy/sites/
          docker run --rm -v /tmp/caddy:/etc/caddy:ro \
            -e DBD_BOT_DOMAIN=bot.example.com -e HUES_DOMAIN=hues.example.com \
            -e ADMIN_DOMAIN=admin.example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # One check that passes only when every job above passes. It keeps the
  # name of the single job the old CI had, which branch protection requires.
  lint-and-test:
    needs: [dbd-bot, hues-and-cues, admin, docker, infra]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A CI job did not succeed ($result)."
              exit 1
            fi
          done
